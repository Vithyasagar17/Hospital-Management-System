{% extends 'layout.html' %}

{% block content %}
<div class="container d-flex align-items-center justify-content-center" style="min-height:65vh;">
    <div class="card shadow-sm" style="width:100%;max-width:420px;">
        <div class="card-body">
            <h3 class="card-title mb-1">Welcome</h3>
            <p class="text-muted mb-4">Sign in to continue</p>

            <form method="POST" action="{{ url_for('auth.login') }}">
                <div class="mb-3">
                    <label for="username" class="form-label">Username</label>
                    <input id="username" name="username" type="text" class="form-control" required autocomplete="username">
                </div>

                <div class="mb-3">
                    <label for="password" class="form-label">Password</label>
                    <input id="password" name="password" type="password" class="form-control" required autocomplete="current-password">
                </div>

                <div class="d-grid mb-2">
                    <button type="submit" class="btn btn-primary btn-lg">Sign in</button>
                </div>

                <p class="text-center text-muted small">Don't have an account? <a href="{{ url_for('auth.register') }}">Create one</a></p>
            </form>
        </div>
    </div>
</div>
{% endblock %}
