{% extends "layout.html" %}

{% block content %}
<div class="container d-flex align-items-center justify-content-center" style="min-height:65vh;">
    <div class="card shadow-sm" style="width:100%;max-width:640px;">
        <div class="card-body">
            <h3 class="card-title mb-1">Create an account</h3>
            <p class="text-muted mb-4">Register as a Doctor or Patient</p>

            <form method="POST" action="{{ url_for('auth.register') }}">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label" for="username">Username</label>
                        <input id="username" name="username" class="form-control" type="text" required autocomplete="username">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label" for="password">Password</label>
                        <input id="password" name="password" class="form-control" type="password" required autocomplete="new-password">
                    </div>
                </div>

                <div class="mb-3 mt-3">
                    <label class="form-label" for="role">Role</label>
                    <select id="role" name="role" class="form-select" required>
                        <option value="">Select Role</option>
                        <option value="Doctor">Doctor</option>
                        <option value="Patient">Patient</option>
                    </select>
                </div>
                    <div id="specialization-group" class="mb-3 d-none">
                        <label class="form-label" for="specialization">Specialization</label>
                        <select id="specialization" name="specialization" class="form-select">
                            <option value="">Select specialization (optional)</option>
                            {% for spec in specializations %}
                                <option value="{{ spec.id }}">{{ spec.name }}</option>
                            {% endfor %}
                        </select>
                    </div>

                <div class="mb-3">
                    <label class="form-label" for="name">Full name</label>
                    <input id="name" name="name" class="form-control" type="text" placeholder="Optional">
                </div>

                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label" for="contact">Contact</label>
                        <input id="contact" name="contact" class="form-control" type="text" placeholder="Optional">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label" for="address">Address</label>
                        <input id="address" name="address" class="form-control" type="text" placeholder="Optional">
                    </div>
                </div>

                <div class="d-grid mt-4">
                    <button class="btn btn-primary btn-lg" type="submit">Register</button>
                </div>

                <p class="text-center text-muted small mt-3">Already have an account? <a href="{{ url_for('auth.login') }}">Sign in</a></p>
            </form>
                            <script>
                                (function(){
                                    const roleEl = document.getElementById('role');
                                    const specGroup = document.getElementById('specialization-group');

                                        function toggleSpec() {
                                            if (!roleEl) return;
                                            const nameInput = document.getElementById('name');
                                            if (roleEl.value === 'Doctor') {
                                                specGroup.classList.remove('d-none');
                                                if (nameInput) nameInput.required = true;
                                            } else if (roleEl.value === 'Patient') {
                                                specGroup.classList.add('d-none');
                                                if (nameInput) nameInput.required = true;
                                            } else {
                                                specGroup.classList.add('d-none');
                                                if (nameInput) nameInput.required = false;
                                                const sel = document.getElementById('specialization');
                                                if (sel) sel.value = '';
                                            }
                                        }

                                    if (roleEl) {
                                        roleEl.addEventListener('change', toggleSpec);
                                        toggleSpec();
                                    }
                                })();
                            </script>
        </div>
    </div>
</div>
{% endblock %}
