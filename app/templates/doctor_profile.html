{% extends 'layout.html' %}

{% block content %}
<div class="container mt-4">
  <h2>Edit Doctor Profile</h2>
  <div class="row justify-content-center">
    <div class="col-md-6">
      <form method="post">
        <div class="mb-3">
          <label for="name" class="form-label">Full Name</label>
          <input type="text" class="form-control" id="name" name="name" value="{{ doctor.name if doctor else '' }}" required>
        </div>

        <button type="submit" class="btn btn-primary">Save</button>
        <a href="{{ url_for('doctor.doctor_dashboard') }}" class="btn btn-link">Cancel</a>
      </form>
    </div>
  </div>
</div>
{% endblock %}
